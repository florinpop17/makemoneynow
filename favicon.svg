<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="50%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base coin circle -->
  <circle 
    cx="256" 
    cy="256" 
    r="240" 
    fill="url(#coinGradient)" 
    stroke="white" 
    stroke-width="8" 
    stroke-opacity="0.1"
    filter="url(#shadow)"
  />
  
  <!-- Money symbol -->
  <path 
    d="M256 96c-88 0-160 40-160 88 0 48 72 88 160 88 8 0 16-0.4 24-1v48c-8 0.6-16 1-24 1-88 0-160-40-160-88v48c0 48 72 88 160 88 8 0 16-0.4 24-1v48c-8 0.6-16 1-24 1-88 0-160-40-160-88v48c0 48 72 88 160 88s160-40 160-88V184c0-48-72-88-160-88z" 
    fill="white"
    fill-opacity="0.95"
  />
</svg> 